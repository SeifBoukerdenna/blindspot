# Golden set for `make bench-search`: what content search should find.
#
# Queries and paths only, never file contents. Paths are relative to the home folder, and a query
# counts as found when any of its `expect` paths appears in the results; `rank` is the position of
# the first one.
#
# `kind = "words"` means the query's words appear in the file, which exact search should already
# find. `kind = "meaning"` means they mostly do not: those are the ones today's one-vector-per-file
# design misses, and the ones the chunking and embedding work is for.
#
# The set deliberately targets this repository and its documents: the files are known, stable and
# already indexed, so the same numbers can be compared across phases on any machine that indexes
# its own checkout.

[[query]]
text = "single instance guard"
expect = ["blindspot/shell/AppDelegate.swift"]
kind = "meaning"

