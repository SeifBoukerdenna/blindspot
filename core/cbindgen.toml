# Generates include/blindspot.h from core/src/ffi.rs. Run via `make header`.

language = "C"
include_guard = "BLINDSPOT_H"
autogen_warning = "/* Generated by cbindgen. Edit core/src/ffi.rs and run `make header`; do not edit this file. */"
documentation = true
documentation_style = "doxy"
# Emits `typedef struct { .. } BsResult;` rather than a bare tagged struct, so Swift
# sees `BsResult` and not `__C.__struct_BsResult`.
style = "type"
# extern "C" { } guards. The header is pulled in through a Swift bridging header,
# which runs it through clang in C mode, but the guards cost nothing and keep the
# header usable from C++ if the shell ever grows an Objective-C++ file.
cpp_compat = true
usize_is_size_t = true

[parse]
parse_deps = false
